<!DOCTYPE html>
<html lang="en" data-room="hub">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A night for you</title>
<meta name="description" content="A letter, nine songs, a poem, a board, and one last lock.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a1c">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/moon.svg" type="image/svg+xml">

<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/shell.css">
<link rel="stylesheet" href="assets/css/hub.css">
<link rel="stylesheet" href="assets/css/letter.css">
<link rel="stylesheet" href="assets/css/playlist.css">
<link rel="stylesheet" href="assets/css/poem.css">
<link rel="stylesheet" href="assets/css/memories.css">
<link rel="stylesheet" href="assets/css/secret.css">
</head>
<body data-room="hub">

<a class="skip-link" href="#stage">Skip to the room</a>

<!-- one sky, shared by every room -->
<div class="sky" id="sky" aria-hidden="true"></div>

<!-- the atmosphere of each room, cross-faded rather than reloaded -->
<div class="atmos" aria-hidden="true">
  <span class="atmos-layer" data-for="hub"></span>
  <span class="atmos-layer" data-for="letter"></span>
  <span class="atmos-layer" data-for="playlist"></span>
  <span class="atmos-layer" data-for="poem"></span>
  <span class="atmos-layer" data-for="memories"></span>
  <span class="atmos-layer" data-for="secret"></span>
</div>

<div class="intro" id="intro" hidden></div>

<main class="stage" id="stage" tabindex="-1" aria-label="The night"></main>

<a class="backlink" id="backlink" href="#/" hidden>
  <span class="backlink-moon" aria-hidden="true">
    <svg viewBox="0 0 24 24" focusable="false"><path d="M17.2 4.6A8.4 8.4 0 1 0 20.4 16a9.2 9.2 0 0 1-3.2-11.4Z"/></svg>
  </span>
  <span>back to the night</span>
</a>

<aside class="miniplayer" id="miniplayer" aria-label="Now playing" hidden></aside>

<div class="toasts" id="toasts" aria-hidden="true"></div>
<p class="sr-only" id="live" role="status" aria-live="polite"></p>

<script src="assets/js/content.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/router.js"></script>
<script src="assets/js/ui/sky.js"></script>
<script src="assets/js/ui/intro.js"></script>
<script src="assets/js/ui/note.js"></script>
<script src="assets/js/ui/miniplayer.js"></script>
<script src="assets/js/rooms/hub.js"></script>
<script src="assets/js/rooms/letter.js"></script>
<script src="assets/js/rooms/playlist.js"></script>
<script src="assets/js/rooms/poem.js"></script>
<script src="assets/js/rooms/memories.js"></script>
<script src="assets/js/rooms/secret.js"></script>
<script src="assets/js/app.js"></script>

</body>
</html>
